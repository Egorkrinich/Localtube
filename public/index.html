<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets//styles/css/utility.css">
    <link rel="stylesheet" href="./assets/styles/css/main.css">
</head>
<body>
    <header class="header f-row-between">
        <div class="header__left f-row-between">
            <div class="header__burger-btn f-column-between">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="header__logo">
                <div class="header__logo f-row">
                    <span>Local<span style="font-weight: 300;">Tube</span></span>
                </div>
            </div>
        </div>
        <div class="header__search f-row-center">
            <div class="search__wrapper">
                <input type="text" class="search__input" placeholder="Search...">
            </div>
            <button class="search__btn f-row-center" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
                </svg>
            </button>
        </div>
        <div class="header__right f-row-between">
            <button class="header__notification">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 -960 960 960">
                    <path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/>
                </svg>
            </button>
            <div class="header__user user f-row">
                <div class="user__avatar f-row-center">
                    <img src="./assets/images/user-test.png" alt="">
                </div>

                <div class="user__menu">
                    <div class="user__channel f-row">
                        <div class="user__avatar f-row-center">
                                <img src="./assets/images/user-test.png" alt="">
                        </div>
                        <div class="user__info">
                            <div class="user__name">Example</div>
                            <a href="#" class="user__link">View uploaded</a>
                        </div>
                    </div>
                    <ul class="user__control f-column">
                        <li>
                            <button href="#" class="control__button f-row">
                                Settings
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Lang
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Theme
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Upload
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>    
</body>
</html>
