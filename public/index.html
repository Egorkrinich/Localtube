<body>
    <header class="header f-row-between">
        <div class="header__left f-row-between">
            <div class="header__burger-btn f-column-between">
                <span></span>
                <span></span>
                <span></span>

                    <span>LocalTube</span>
                </div>
            </div>
        </div>

        </div>
        <div class="header__right f-row-between">
            <button class="header__notification">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 -960 960 960">

                <div class="avatar f-row-center">
                    <img src="./assets/images/user-test.png" alt="">
                </div>

                <div class="user__menu">
                    <div class="user__channel f-row">
                        <div class="avatar f-row-center">
                                <img src="./assets/images/user-test.png" alt="">
                        </div>
                        <div class="user__info">
                            <div class="user__name">Example</div>
                            <a href="#" class="user__link">View uploaded</a>
                        </div>
                    </div>
                    <ul class="user__control f-column">
                        <li>
                            <button href="#" class="control__button f-row">
                                Settings
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Lang
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Theme
                            </button>
                        </li>
                        <li>
                            <button href="#" class="control__button f-row">
                                Upload
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

                <div class="preview__body f-row">
                    <div class="preview__left">
                        <div class="avatar">
                            <img src="./assets/images/user-test.png" alt="">
                        </div>
                    </div>
                    <div class="preview__right f-row-between">
                        <div class="preview__meta">
                            <h3 class="preview__title">
                                Test 123 Test 123 Test 123 Test 123 Test 123 Test 123
                            </h3>
                            <div class="preview__uploader">
                                Test
                            </div>
                            <div class="preview__info">
                                10k views • 42 min ago
                            </div>

                        </div>
                        <div class="preview__interact interact">
                            <button class="interact__button">
